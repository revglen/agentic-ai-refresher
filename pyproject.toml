[project]
name = "agentic-ai-refresher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "revglen", email = "revglen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.18",
    "langchain>=1.4.2",
    "langchain-core>=1.6.4",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "langsmith>=0.14.0",
    "mcp>=1.30.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[tool.uv]
package = false

[project.scripts]
agentic-ai-refresher = "agentic_ai_refresher:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
